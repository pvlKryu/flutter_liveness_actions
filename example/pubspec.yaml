name: example
description: Example app for flutter_liveness_actions mobile onboarding demos.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  flutter_liveness_actions:
    path: ../
  camera: ^0.11.1
  permission_handler: ^11.4.0
  google_mlkit_face_detection: ^0.14.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
